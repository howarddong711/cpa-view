name: Build Linux plugin

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build native plugin
        env:
          CGO_ENABLED: "1"
        run: go build -buildvcs=false -buildmode=c-shared -o cpa-view-linux-amd64.so .
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-view-linux-amd64
          path: cpa-view-linux-amd64.so
