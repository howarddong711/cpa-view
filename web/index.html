<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CPA View</title>
  <style>
    :root{color-scheme:dark;--bg:var(--cpa-background,#151515);--panel:var(--cpa-surface,#1d1d1d);--line:var(--cpa-border,#3b3935);--muted:var(--cpa-muted,#aaa49c);--accent:var(--cpa-primary,#68d391);--danger:var(--cpa-danger,#f87171);--warn:#f0b35b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 "IBM Plex Sans","Noto Sans SC",sans-serif;color:var(--cpa-text,#f5f5f5)}
    .shell{max-width:1500px;margin:24px auto;padding:28px;background:rgba(27,27,27,.94);border:1px solid var(--line);border-radius:24px;box-shadow:0 22px 70px #0008}
    header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:22px}.brand h1{margin:0;font-size:28px}.brand p{margin:6px 0 0;color:var(--muted)}
    nav{display:flex;gap:8px}button,.select,input{background:#222;border:1px solid #444;border-radius:12px;color:#eee;padding:10px 14px}button{cursor:pointer}button.primary{background:var(--accent);color:#08110b;border-color:var(--accent);font-weight:700}button:hover{filter:brightness(1.12)}
    .toolbar{display:flex;gap:10px;align-items:center;padding:20px 0;flex-wrap:wrap}.tabs button{border-radius:999px}.tabs button.active{background:#eee;color:#111}.spacer{flex:1}.select,input{min-width:170px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:1040px}.table th,.table td{padding:15px 14px;border-bottom:1px solid #303030;text-align:left;white-space:nowrap}.table th{color:#aaa;font-weight:600;background:#181818}.table tr:last-child td{border-bottom:0}.email{font-weight:600}.sub{display:block;color:var(--muted);font-size:12px;margin-top:3px}.good{color:var(--accent)}.bad{color:var(--danger)}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#283b2e;color:var(--accent);font-size:12px;margin:2px}.empty{padding:48px;text-align:center;color:var(--muted)}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:10px 0 24px}.card{padding:16px;border:1px solid var(--line);border-radius:16px;background:#1a1a1a}.card small{color:var(--muted)}.card strong{display:block;font-size:24px;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.chart{height:230px;border:1px solid var(--line);border-radius:16px;padding:16px}.bars{display:flex;align-items:end;gap:7px;height:165px}.bar{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:4px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px}.dialog{width:min(860px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}.dialog textarea{width:100%;height:220px;background:#101010;color:#eee;border:1px solid var(--line);border-radius:10px;padding:12px;font:12px ui-monospace}.price-grid{display:grid;grid-template-columns:1.4fr repeat(4,1fr) auto;gap:8px}.price-grid input{min-width:0;width:100%}.price-list{max-height:360px;overflow:auto;margin-top:14px}.price-row{display:grid;grid-template-columns:1.4fr repeat(4,1fr) auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.hidden{display:none}
    @media(max-width:760px){.shell{margin:0;padding:16px;border-radius:0;min-height:100vh}.grid{grid-template-columns:1fr}header{align-items:flex-start;gap:12px;flex-direction:column}}
  </style>
</head>
<body><main class="shell">
  <header><div class="brand"><h1>认证文件 <span id="accountCount" class="pill">0 个凭证</span></h1><p>查看本地认证文件的请求活动及额度情况。</p></div><nav><button id="themeInfo">跟随 CPA 主题</button><button id="refresh">↻ 刷新</button><button id="priceBtn">模型价格</button><button class="primary" id="importBtn">导入账号</button></nav></header>
  <section class="toolbar"><div class="tabs"><button class="active" data-tab="accounts">账号池</button><button data-tab="dashboard">数据面板</button></div><button id="newGroup">+ 分组</button><div class="spacer"></div><input id="search" placeholder="搜索邮箱或名称"><select id="group" class="select"><option>全部</option><option>Codex</option></select></section>
  <section id="accountsView"><div class="table-wrap"><table class="table"><thead><tr><th>名称 / 邮箱</th><th>请求总数</th><th>成功率</th><th>Token 总数</th><th>输入</th><th>输出</th><th>缓存命中率</th><th>预估消耗</th><th>最近活动</th><th>状态</th><th>分组</th></tr></thead><tbody id="accountRows"></tbody></table><div id="empty" class="empty hidden">暂无账号数据。点击“导入账号”开始。</div></div></section>
  <section id="dashboardView" class="hidden"><div class="toolbar"><label>时间范围 <select id="range" class="select"><option value="1">今天</option><option value="7" selected>近 7 天</option><option value="30">近 30 天</option></select></label><button id="dashRefresh">刷新面板</button></div><div class="cards" id="cards"></div><div class="grid"><div class="chart"><h3>Token 使用趋势</h3><div id="bars" class="bars"></div></div><div class="chart"><h3>模型使用排行</h3><div id="models"></div></div><div class="chart"><h3>账号使用排行</h3><div id="accountsRank"></div></div><div class="chart"><h3>最近活动</h3><div id="timeline" class="sub">暂无数据</div></div></div></section>
</main>
<div id="modal" class="modal hidden"><div class="dialog"><h2>导入账号</h2><p class="sub">支持 CPA JSON、sub2api、JSONL、TXT、ZIP。Token 只在本地内存中用于确认，不会返回浏览器。</p><textarea id="jsonInput" placeholder="粘贴 JSON 文本，或选择文件后预览"></textarea><div class="toolbar"><input type="file" id="fileInput" accept=".json,.jsonl,.ndjson,.txt,.zip"><div class="spacer"></div><button id="cancel">取消</button><button class="primary" id="preview">生成脱敏预览</button></div><div id="previewResult" class="sub"></div></div></div>
<div id="priceModal" class="modal hidden"><div class="dialog"><h2>模型价格设置</h2><p class="sub">价格单位为 USD / 1M tokens。官方同步来源：Models.dev；自定义价格会在下次同步时被覆盖。</p><div class="toolbar"><button id="syncPrices">↻ 同步官方价格</button><span id="priceStatus" class="sub">尚未加载</span><div class="spacer"></div><button id="priceClose">关闭</button></div><div class="price-grid"><input id="priceModel" placeholder="模型 ID"><input id="priceInput" type="number" step="0.0001" placeholder="输入"><input id="priceOutput" type="number" step="0.0001" placeholder="输出"><input id="priceCached" type="number" step="0.0001" placeholder="缓存读取"><input id="priceWrite" type="number" step="0.0001" placeholder="缓存写入"><button class="primary" id="priceSave">保存</button></div><div id="priceList" class="price-list"><span class="sub">暂无价格</span></div></div></div>
<script>
window.__CPA_VIEW_SNAPSHOT__=null;
const $=s=>document.querySelector(s);let managementKey='';const initialSnapshot=window.__CPA_VIEW_SNAPSHOT__||{};
async function api(p,o={},retry=true){const headers={'Content-Type':'application/json',...(o.headers||{})};if(managementKey)headers.Authorization=`Bearer ${managementKey}`;const response=await fetch('/v0/management/cpa-view'+p,{...o,headers});if(response.status===401&&retry){const key=prompt('请输入 CPA Management Key。密钥只保存在当前页面内存中。');if(!key)throw new Error('management key required');managementKey=key;return api(p,o,false)}const data=await response.json().catch(()=>({error:'request_failed'}));if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);return data}
let rows=initialSnapshot.accounts||[]; function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadAccounts(){try{const d=await api('/accounts');rows=d.accounts||[];renderRows()}catch(e){$('#accountRows').innerHTML='<tr><td colspan="10" class="empty">无法读取 CPA Auth 列表</td></tr>'}}
function renderRows(){const q=$('#search').value.toLowerCase(),g=$('#group').value;const list=rows.filter(r=>(!q||(r.name+' '+r.email).toLowerCase().includes(q))&&(!g||g==='全部'||(r.groups||[]).includes(g)));$('#accountCount').textContent=rows.length+' 个凭证';$('#empty').classList.toggle('hidden',list.length!==0);$('#accountRows').innerHTML=list.map(r=>`<tr><td><span class="email">${esc(r.name||'未命名')}</span><span class="sub">${esc(r.email||'暂无邮箱')} · ${esc(r.type||'unknown')}</span></td><td>${r.request_count||0}</td><td class="${(r.success_rate??0)>=95?'good':'bad'}">${r.success_rate==null?'暂无数据':r.success_rate.toFixed(2)+'%'}</td><td>${(r.total_tokens||0).toLocaleString()}</td><td>${(r.input_tokens||0).toLocaleString()}</td><td>${(r.output_tokens||0).toLocaleString()}</td><td>${r.cached_tokens?Math.round(r.cached_tokens*100/Math.max(1,r.input_tokens))+'%':'暂无数据'}</td><td class="warn">${r.estimated_cost?'$'+r.estimated_cost.toFixed(4):'暂无价格'}</td><td>${r.last_activity?new Date(r.last_activity).toLocaleString():'暂无数据'}</td><td class="${r.disabled?'bad':'good'}">${r.disabled?'已禁用':(r.status||'可用')}</td><td>${(r.groups||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</td></tr>`).join('')}
async function loadDashboard(){const d=initialSnapshot.dashboard&&$('#range').value==='7'&&!managementKey?initialSnapshot.dashboard:await api('/dashboard?days='+$('#range').value);const vals=[['请求总数',d.requests],['成功率',(d.success_rate||0).toFixed(2)+'%'],['Token 总数',d.total_tokens],['输入 Token',d.input_tokens],['输出 Token',d.output_tokens],['缓存命中率',(d.cache_hit_rate||0).toFixed(2)+'%'],['RPM',(d.rpm||0).toFixed(2)],['TPM',(d.tpm||0).toFixed(0)],['估算成本','$'+(d.estimated_cost||0).toFixed(4)]];$('#cards').innerHTML=vals.map(x=>`<div class="card"><small>${x[0]}</small><strong>${Number.isFinite(x[1])?x[1].toLocaleString():x[1]}</strong></div>`).join('');const trend=Object.entries(d.token_trend||{}).slice(-24),max=Math.max(1,...trend.map(x=>(x[1].input||0)+(x[1].output||0)));$('#bars').innerHTML=trend.map(x=>`<div class="bar" title="${x[0]}" style="height:${Math.max(4,((x[1].input||0)+(x[1].output||0))*160/max)}px"></div>`).join('')||'<span class="sub">暂无数据</span>';const renderRank=(obj)=>Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #292929"><span>${esc(x[0]||'未知')}</span><span class="good">${x[1]}</span></div>`).join('')||'<span class="sub">暂无数据</span>';$('#models').innerHTML=renderRank(d.model_ranking);$('#accountsRank').innerHTML=renderRank(d.account_ranking)}
async function loadGroups(){const d=initialSnapshot.groups?{groups:initialSnapshot.groups}:await api('/groups');if(d.groups){$('#group').innerHTML=d.groups.map(x=>`<option>${esc(x)}</option>`).join('')}}
async function loadPrices(){try{const d=await api('/prices');const list=d.prices||[];$('#priceStatus').textContent=list.length+' 个模型 · 可编辑';$('#priceList').innerHTML=list.map(p=>`<div class="price-row"><strong>${esc(p.model)}</strong><span>$${p.input}</span><span>$${p.output}</span><span>$${p.cached}</span><span>$${p.cache_write}</span><span class="sub">${esc(p.source||'custom')}</span></div>`).join('')||'<span class="sub">暂无价格，请同步官方价格或手动添加。</span>'}catch(e){$('#priceStatus').textContent='需要 Management Key 才能管理价格'}}
$('#priceBtn').onclick=()=>{$('#priceModal').classList.remove('hidden');loadPrices()};$('#priceClose').onclick=()=>$('#priceModal').classList.add('hidden');$('#syncPrices').onclick=async()=>{try{const d=await api('/prices/sync',{method:'POST'});$('#priceStatus').textContent='已同步 '+d.synced+' 个模型';loadPrices()}catch(e){$('#priceStatus').textContent='同步失败：'+e.message}};$('#priceSave').onclick=async()=>{try{await api('/prices',{method:'PUT',body:JSON.stringify({model:$('#priceModel').value,input:Number($('#priceInput').value||0),output:Number($('#priceOutput').value||0),cached:Number($('#priceCached').value||0),cache_write:Number($('#priceWrite').value||0)})});$('#priceStatus').textContent='已保存';loadPrices()}catch(e){$('#priceStatus').textContent='保存失败：'+e.message}};
$('#newGroup').onclick=async()=>{const name=prompt('新分组名称');if(name){await api('/groups',{method:'POST',body:JSON.stringify({name})});await loadGroups();}};$('#refresh').onclick=loadAccounts;$('#dashRefresh').onclick=loadDashboard;$('#search').oninput=renderRows;$('#group').onchange=renderRows;$('#range').onchange=loadDashboard;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('#accountsView').classList.toggle('hidden',b.dataset.tab!=='accounts');$('#dashboardView').classList.toggle('hidden',b.dataset.tab!=='dashboard');if(b.dataset.tab==='dashboard')loadDashboard()});$('#importBtn').onclick=()=>$('#modal').classList.remove('hidden');$('#cancel').onclick=()=>$('#modal').classList.add('hidden');$('#fileInput').onchange=async e=>{const f=e.target.files[0];if(f){window.importName=f.name;if(/\.zip$/i.test(f.name)){const b=new Uint8Array(await f.arrayBuffer());let s='';for(const x of b)s+=String.fromCharCode(x);$('#jsonInput').value='';window.importBase64=btoa(s)}else{$('#jsonInput').value=await f.text();window.importBase64=''}}};$('#preview').onclick=async()=>{const d=await api('/imports/preview',{method:'POST',body:JSON.stringify({filename:window.importName||'paste.json',content:$('#jsonInput').value,content_base64:window.importBase64||''})});if(d.error){$('#previewResult').textContent='错误：'+d.error;return}$('#previewResult').innerHTML=`识别为 ${esc(d.format)}，发现 ${d.accounts.length} 个账号，重复 ${d.duplicates} 个。预览有效期 10 分钟。<br><button class="primary" id="commit">确认导入</button>`;$('#commit').onclick=async()=>{const r=await api('/imports/commit',{method:'POST',body:JSON.stringify({preview_id:d.preview_id})});$('#previewResult').textContent=`已导入 ${r.imported||0} 个，跳过 ${r.skipped||0} 个`;loadAccounts()}};loadGroups();renderRows();
</script></body></html>
