<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CPA View</title>
  <style>
    :root{color-scheme:dark;--bg:#121212;--panel:#1b1b1b;--line:#343434;--muted:#9b9b9b;--accent:#68d391;--danger:#f87171}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#252525,#111 45%);font:14px/1.45 Inter,system-ui,sans-serif;color:#f5f5f5}
    .shell{max-width:1500px;margin:24px auto;padding:28px;background:rgba(27,27,27,.94);border:1px solid var(--line);border-radius:24px;box-shadow:0 22px 70px #0008}
    header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:22px}.brand h1{margin:0;font-size:28px}.brand p{margin:6px 0 0;color:var(--muted)}
    nav{display:flex;gap:8px}button,.select,input{background:#222;border:1px solid #444;border-radius:12px;color:#eee;padding:10px 14px}button{cursor:pointer}button.primary{background:var(--accent);color:#08110b;border-color:var(--accent);font-weight:700}button:hover{filter:brightness(1.12)}
    .toolbar{display:flex;gap:10px;align-items:center;padding:20px 0;flex-wrap:wrap}.tabs button{border-radius:999px}.tabs button.active{background:#eee;color:#111}.spacer{flex:1}.select,input{min-width:170px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:1040px}.table th,.table td{padding:15px 14px;border-bottom:1px solid #303030;text-align:left;white-space:nowrap}.table th{color:#aaa;font-weight:600;background:#181818}.table tr:last-child td{border-bottom:0}.email{font-weight:600}.sub{display:block;color:var(--muted);font-size:12px;margin-top:3px}.good{color:var(--accent)}.bad{color:var(--danger)}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#283b2e;color:var(--accent);font-size:12px;margin:2px}.empty{padding:48px;text-align:center;color:var(--muted)}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:10px 0 24px}.card{padding:16px;border:1px solid var(--line);border-radius:16px;background:#1a1a1a}.card small{color:var(--muted)}.card strong{display:block;font-size:24px;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.chart{height:230px;border:1px solid var(--line);border-radius:16px;padding:16px}.bars{display:flex;align-items:end;gap:7px;height:165px}.bar{flex:1;background:linear-gradient(#68d391,#31573f);border-radius:4px 4px 0 0;min-height:4px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px}.dialog{width:min(720px,100%);background:#1c1c1c;border:1px solid #555;border-radius:18px;padding:22px}.dialog textarea{width:100%;height:220px;background:#101010;color:#eee;border:1px solid #444;border-radius:10px;padding:12px;font:12px ui-monospace}.hidden{display:none}
    @media(max-width:760px){.shell{margin:0;padding:16px;border-radius:0;min-height:100vh}.grid{grid-template-columns:1fr}header{align-items:flex-start;gap:12px;flex-direction:column}}
  </style>
</head>
<body><main class="shell">
  <header><div class="brand"><h1>CPA View</h1><p>简化版账号池与使用量面板 · 凭据仅由 CPA Auth 回调管理</p></div><nav><button id="refresh">↻ 刷新</button><button class="primary" id="importBtn">导入账号</button></nav></header>
  <section class="toolbar"><div class="tabs"><button class="active" data-tab="accounts">账号池</button><button data-tab="dashboard">数据面板</button></div><div class="spacer"></div><input id="search" placeholder="搜索邮箱或名称"><select id="group" class="select"><option>全部</option><option>Codex</option></select></section>
  <section id="accountsView"><div class="table-wrap"><table class="table"><thead><tr><th>名称 / 邮箱</th><th>请求总数</th><th>成功率</th><th>Token 总数</th><th>输入</th><th>输出</th><th>缓存命中率</th><th>最近活动</th><th>状态</th><th>分组</th></tr></thead><tbody id="accountRows"></tbody></table><div id="empty" class="empty hidden">暂无账号数据。点击“导入账号”开始。</div></div></section>
  <section id="dashboardView" class="hidden"><div class="toolbar"><label>时间范围 <select id="range" class="select"><option value="1">今天</option><option value="7" selected>近 7 天</option><option value="30">近 30 天</option></select></label><button id="dashRefresh">刷新面板</button></div><div class="cards" id="cards"></div><div class="grid"><div class="chart"><h3>Token 使用趋势</h3><div id="bars" class="bars"></div></div><div class="chart"><h3>模型使用排行</h3><div id="models"></div></div><div class="chart"><h3>账号使用排行</h3><div id="accountsRank"></div></div><div class="chart"><h3>最近活动</h3><div id="timeline" class="sub">暂无数据</div></div></div></section>
</main>
<div id="modal" class="modal hidden"><div class="dialog"><h2>导入账号</h2><p class="sub">支持 CPA JSON、sub2api、JSONL、TXT、ZIP。Token 只在本地内存中用于确认，不会返回浏览器。</p><textarea id="jsonInput" placeholder="粘贴 JSON 文本，或选择文件后预览"></textarea><div class="toolbar"><input type="file" id="fileInput" accept=".json,.jsonl,.ndjson,.txt,.zip"><div class="spacer"></div><button id="cancel">取消</button><button class="primary" id="preview">生成脱敏预览</button></div><div id="previewResult" class="sub"></div></div></div>
<script>
const $=s=>document.querySelector(s), api=(p,o={})=>fetch('/v0/management/cpa-view'+p,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}).then(r=>r.json());
let rows=[]; function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadAccounts(){try{const d=await api('/accounts');rows=d.accounts||[];renderRows()}catch(e){$('#accountRows').innerHTML='<tr><td colspan="10" class="empty">无法读取 CPA Auth 列表</td></tr>'}}
function renderRows(){const q=$('#search').value.toLowerCase(),g=$('#group').value;const list=rows.filter(r=>(!q||(r.name+' '+r.email).toLowerCase().includes(q))&&(!g||g==='全部'||(r.groups||[]).includes(g)));$('#empty').classList.toggle('hidden',list.length!==0);$('#accountRows').innerHTML=list.map(r=>`<tr><td><span class="email">${esc(r.name||'未命名')}</span><span class="sub">${esc(r.email||'暂无邮箱')} · ${esc(r.type||'unknown')}</span></td><td>${r.request_count||0}</td><td class="${(r.success_rate??0)>=95?'good':'bad'}">${r.success_rate==null?'暂无数据':r.success_rate.toFixed(2)+'%'}</td><td>${(r.total_tokens||0).toLocaleString()}</td><td>${(r.input_tokens||0).toLocaleString()}</td><td>${(r.output_tokens||0).toLocaleString()}</td><td>${r.cached_tokens?Math.round(r.cached_tokens*100/Math.max(1,r.input_tokens))+'%':'暂无数据'}</td><td>${r.last_activity?new Date(r.last_activity).toLocaleString():'暂无数据'}</td><td class="${r.disabled?'bad':'good'}">${r.disabled?'已禁用':(r.status||'可用')}</td><td>${(r.groups||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</td></tr>`).join('')}
async function loadDashboard(){const d=await api('/dashboard?days='+$('#range').value);const vals=[['请求总数',d.requests],['成功率',(d.success_rate||0).toFixed(2)+'%'],['Token 总数',d.total_tokens],['输入 Token',d.input_tokens],['输出 Token',d.output_tokens],['缓存命中率',(d.cache_hit_rate||0).toFixed(2)+'%'],['RPM',(d.rpm||0).toFixed(2)],['TPM',(d.tpm||0).toFixed(0)],['估算成本','$'+(d.estimated_cost||0).toFixed(4)]];$('#cards').innerHTML=vals.map(x=>`<div class="card"><small>${x[0]}</small><strong>${Number.isFinite(x[1])?x[1].toLocaleString():x[1]}</strong></div>`).join('');const trend=Object.entries(d.token_trend||{}).slice(-24),max=Math.max(1,...trend.map(x=>(x[1].input||0)+(x[1].output||0)));$('#bars').innerHTML=trend.map(x=>`<div class="bar" title="${x[0]}" style="height:${Math.max(4,((x[1].input||0)+(x[1].output||0))*160/max)}px"></div>`).join('')||'<span class="sub">暂无数据</span>';const renderRank=(obj)=>Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #292929"><span>${esc(x[0]||'未知')}</span><span class="good">${x[1]}</span></div>`).join('')||'<span class="sub">暂无数据</span>';$('#models').innerHTML=renderRank(d.model_ranking);$('#accountsRank').innerHTML=renderRank(d.account_ranking)}
$('#refresh').onclick=loadAccounts;$('#dashRefresh').onclick=loadDashboard;$('#search').oninput=renderRows;$('#group').onchange=renderRows;$('#range').onchange=loadDashboard;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('#accountsView').classList.toggle('hidden',b.dataset.tab!=='accounts');$('#dashboardView').classList.toggle('hidden',b.dataset.tab!=='dashboard');if(b.dataset.tab==='dashboard')loadDashboard()});$('#importBtn').onclick=()=>$('#modal').classList.remove('hidden');$('#cancel').onclick=()=>$('#modal').classList.add('hidden');$('#fileInput').onchange=async e=>{const f=e.target.files[0];if(f){window.importName=f.name;if(/\.zip$/i.test(f.name)){const b=new Uint8Array(await f.arrayBuffer());let s='';for(const x of b)s+=String.fromCharCode(x);$('#jsonInput').value='';window.importBase64=btoa(s)}else{$('#jsonInput').value=await f.text();window.importBase64=''}}};$('#preview').onclick=async()=>{const d=await api('/imports/preview',{method:'POST',body:JSON.stringify({filename:window.importName||'paste.json',content:$('#jsonInput').value,content_base64:window.importBase64||''})});if(d.error){$('#previewResult').textContent='错误：'+d.error;return}$('#previewResult').innerHTML=`识别为 ${esc(d.format)}，发现 ${d.accounts.length} 个账号，重复 ${d.duplicates} 个。预览有效期 10 分钟。<br><button class="primary" id="commit">确认导入</button>`;$('#commit').onclick=async()=>{const r=await api('/imports/commit',{method:'POST',body:JSON.stringify({preview_id:d.preview_id})});$('#previewResult').textContent=`已导入 ${r.imported||0} 个，跳过 ${r.skipped||0} 个`;loadAccounts()}};loadAccounts();
</script></body></html>
